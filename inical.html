<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Concluído - Sucesso!</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="success-container">
        <!-- Success Icon -->
        <div class="success-icon">
            <i class="fa-solid fa-check"></i>
        </div>

        <!-- Success Title -->
        <h1 class="success-title">Cadastro Concluído!</h1>
        <p class="success-subtitle">Sua conta foi criada com sucesso. Bem-vindo(a) à nossa plataforma!</p>

        <!-- User Data Display -->
        <div class="success-data">
            <div class="success-data__item">
                <span class="success-data__label">Nome</span>
                <span class="success-data__value" id="displayNome">-</span>
            </div>
            <div class="success-data__item">
                <span class="success-data__label">Email</span>
                <span class="success-data__value" id="displayEmail">-</span>
            </div>
            <div class="success-data__item">
                <span class="success-data__label">Idade</span>
                <span class="success-data__value" id="displayIdade">-</span>
            </div>
            <div class="success-data__item">
                <span class="success-data__label">Data do Cadastro</span>
                <span class="success-data__value" id="displayData">-</span>
            </div>
        </div>

        <!-- Success Actions -->
        <div class="success-actions">
            <a href="exemplo01.html" class="btn btn--secondary">
                <i class="fa-solid fa-arrow-left btn--icon"></i>
                Voltar
            </a>
            <a href="#" class="btn btn--primary">
                <i class="fa-solid fa-house btn--icon"></i>
                Ir para Home
            </a>
        </div>
    </div>

    <!-- JavaScript to display form data -->
    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        
        // Display the submitted data
        const nome = urlParams.get('nome');
        const email = urlParams.get('email');
        const idade = urlParams.get('idade');
        
        if (nome) document.getElementById('displayNome').textContent = nome;
        if (email) document.getElementById('displayEmail').textContent = email;
        if (idade) document.getElementById('displayIdade').textContent = idade + ' anos';
        
        // Set current date
        const hoje = new Date();
        const dataFormatada = hoje.toLocaleDateString('pt-BR', {
            day: '2-digit',
            month: 'long',
            year: 'numeric'
        });
        document.getElementById('displayData').textContent = dataFormatada;
    </script>
</body>
</html>
