<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Escola Virtual</title>
    <style>
        /* CSS Simples para deixar a página bonita */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Faz a página ocupar a altura total da tela */
            text-align: center;
        }

        .home-card {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn-formulario {
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .btn-formulario:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="home-card">
        <h1>Bem-vindo à Escola Virtual</h1>
        <p>
            Seja bem-vindo ao nosso portal de matrículas. <br> 
            Para iniciar o processo de inscrição do aluno, por favor, clique no botão abaixo.
        </p>
        
        <!-- Link para a página do formulário que criamos -->
        <a href="formulario.html" class="btn-formulario">
            Acessar Formulário de Pré-Matrícula
        </a>
    </div>

</body>
</html>
